name: Build and Deploy Corpova

# pull_request runs both jobs, but never publishes an image: in the build job
# the GHCR login and the push are gated on the event not being a
# pull_request. Watchtower on the server deploys whatever :latest points at,
# so a PR that could push :latest would deploy unmerged code.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Bump this deliberately and read the diff, rather than being bumped by it.
  # Same version as pubvera-recallis and pubvera-grantvera.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # No LFS checkout: the vendored CLI binary was the only LFS file, and
      # the image now builds the CLI from a pinned upstream commit.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt: zero files"

      # A pipeline returns the exit code of its LAST command, so without
      # pipefail `go test | tee` was green whenever tee succeeded, even with
      # failing tests; only the Count results step below caught them.
      - name: Test with race detector
        run: |
          set -o pipefail
          go test ./... -count=1 -race -v 2>&1 | tee test.log

      - name: Count results
        if: always()
        run: |
          PASS=$(grep -c '^--- PASS' test.log || true)
          FAIL=$(grep -c '^--- FAIL' test.log || true)
          SKIP=$(grep -c '^--- SKIP' test.log || true)
          echo "PASS=$PASS FAIL=$FAIL SKIP=$SKIP"
          echo "PASS=$PASS FAIL=$FAIL SKIP=$SKIP" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" != "0" ]; then exit 1; fi

      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches. It
      # scans this module only; a CLI built from a pinned upstream commit in the
      # Dockerfile is a separate binary and is not covered.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the JavaScript embedded in index.html, so a
          # missing bracket there ships green and breaks the page at runtime.
          # Each <script> block is extracted and parsed with node --check.
          # A file that exists but yields no checkable block fails the build:
          # silently checking nothing is the failure mode this guards against.
          set -euo pipefail
          html=""
          for candidate in index.html web/index.html; do
            if [ -f "$candidate" ]; then html="$candidate"; break; fi
          done
          if [ -z "$html" ]; then
            echo "no index.html found - nothing to check"
            exit 0
          fi
          echo "checking $html"
          tmp=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const dir = process.argv[2];
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0;
            while ((m = re.exec(html)) !== null) {
              const attrs = m[1], body = m[2];
              if (body.trim() === "") continue;
              if (/\stype\s*=\s*["\x27](?!text\/javascript|module)/i.test(attrs)) continue;
              const isModule = /\stype\s*=\s*["\x27]module["\x27]/i.test(attrs);
              i += 1;
              fs.writeFileSync(path.join(dir, "block" + i + (isModule ? ".mjs" : ".js")), body);
            }
            console.log(i);
          ' "$html" "$tmp" > "$tmp/count"
          n=$(cat "$tmp/count")
          if [ "$n" -eq 0 ]; then
            echo "$html contains no inline script block - refusing to pass silently"
            exit 1
          fi
          for f in "$tmp"/block*; do
            node --check "$f"
          done
          echo "$n inline block(s) parse"

  # This job runs on pull_request too. It used to be skipped there with a
  # job-level if, which meant a PR never built the image — so the label check
  # below could never fire on a PR. The gate now sits on the two steps that
  # touch the registry instead.
  build:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # No LFS checkout here either: nothing in the build context needs it.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The image carries the upstream commit its CLI was built from as the
      # label org.pubvera.cli.commit. On pubvera-recallis that label once
      # shipped EMPTY (an ARG default that never reached the runtime stage)
      # while the build, the tests and the deploy were all green. So this
      # builds the image locally first and compares the label with the commit
      # pinned in the Dockerfile, BEFORE anything is pushed. A mismatch stops
      # the job, so an image that cannot say where its CLI came from never
      # reaches :latest.
      #
      # The second build below reuses the gha cache this one fills, so the
      # extra cost is the load into the runner's Docker, not a rebuild.
      - name: Build image for the label check
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: corpova-label-check:ci
          cache-from: type=gha

      - name: Check the CLI commit label
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ARG PP_LIBRARY_COMMIT=//p' Dockerfile)
          actual=$(docker image inspect corpova-label-check:ci --format '{{ index .Config.Labels "org.pubvera.cli.commit" }}')
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Dockerfile has no global 'ARG PP_LIBRARY_COMMIT=<40-hex commit>' line"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "label org.pubvera.cli.commit does not match the commit pinned in the Dockerfile"
            exit 1
          fi
          echo "label matches the pinned commit"

      # Skipped on pull_request: a PR build proves the image builds, but has no
      # reason to hold registry credentials.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pull_request the image is built but not pushed, so :latest — and
      # therefore what Watchtower deploys — only ever moves on main.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max