name: Build and Deploy Corpova

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt talalt formazatlan fajlokat:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt: nulla sor"

      - name: Test with race detector
        run: go test ./... -count=1 -race -v 2>&1 | tee test.log

      - name: Count results
        if: always()
        run: |
          PASS=$(grep -c '^--- PASS' test.log || true)
          FAIL=$(grep -c '^--- FAIL' test.log || true)
          SKIP=$(grep -c '^--- SKIP' test.log || true)
          echo "PASS=$PASS FAIL=$FAIL SKIP=$SKIP"
          echo "PASS=$PASS FAIL=$FAIL SKIP=$SKIP" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" != "0" ]; then exit 1; fi

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
